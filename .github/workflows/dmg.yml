name: Build DMG
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build app and DMG
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::version must use the format 1.0.0 (without v)'
            exit 1
          fi
          app=build/dmg/UMLet.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp Info.plist "$app/Contents/Info.plist"
          cp Resources/* "$app/Contents/Resources/"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $VERSION" "$app/Contents/Info.plist"
          for arch in arm64 x86_64; do
            xcrun swiftc -O -target "$arch-apple-macosx12.0" \
              Sources/UMLetLauncher.swift -o "build/launcher-$arch"
          done
          xcrun lipo -create build/launcher-arm64 build/launcher-x86_64 \
            -output "$app/Contents/MacOS/UMLetLauncher"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname UMLet -srcfolder build/dmg \
            -format UDZO -ov build/UMLet.dmg

      - uses: actions/upload-artifact@v7
        with:
          path: build/UMLet.dmg
          archive: false
          if-no-files-found: error

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/UMLet.dmg \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
